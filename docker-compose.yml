services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    command: uvicorn apps.gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      AIRLOCK_DB_PATH: /data/airlock.db
      AIRLOCK_TRUSTED_DIR: /data/registry/trusted
      AIRLOCK_QUARANTINE_DIR: /data/registry/quarantine
      AIRLOCK_REJECTED_DIR: /data/registry/rejected
      AIRLOCK_LKG_DIR: /data/registry/lkg
      AIRLOCK_POLICY_FILE: /app/core/policies/default.yaml
      AIRLOCK_SANDBOX_ENABLED: "false"
    volumes:
      - .:/app
      - airlock-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  airlock-data:
